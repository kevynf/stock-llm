[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "stockllm"
version = "0.1.2"
description = "Local-first A-share research assistant"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "keyring>=25.6,<26",
  "lxml>=5,<7",
  "pydantic>=2.11,<3",
  "pypdf>=6,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
data = [
  "akshare>=1.17",
  "baostock>=0.8.9",
  "polars>=1.32,<2",
  "pyarrow>=25,<26",
]
dev = [
  "pandas>=2.2,<4",
  "pytest>=8.4,<9",
]
desktop = [
  "pyinstaller>=6.16,<7",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["stockllm*"]
